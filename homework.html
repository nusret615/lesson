<body>

<table>

        <th colspan="2">Bank and deposit name</th>
        <th>Amount</th>
        <th>Term</th>
        <th>Rate</th>
    </tr>

    <tr>
        <td>ICD</td>
        <td>Christmas Dreams</td>
        <td>From 50,000 rubles, up to 1,000,000 rubles</td>
        <td>395 days</td>
        <td>7.5%</td>

    <tr>
        <td>Premier BCS</td>
        <td>Investment</td>
        <td>From 50 000 rub.</td>
        <td>181 days</td>
        <td>up to 7.5%</td>
    </tr>

    <tr>
        <td rowspan="2">Opening</td>
        <td>Reliable Promo. *</td>
        <td>From 750 000 rub.</td>
        <td>367 days</td>
        <td>5.56%</td>
    </tr>

    <tr>
        <td>Cumulative</td>
        <td>From 1 rub.</td>
        <td>from 1 month</td>
        <td>up to 9%</td>
    </tr>

</table>

</body>
</html>
