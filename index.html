<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Grid task</title>

    <style>
      .container {
        width: 600px;
        height:800px;
        margin: 50px auto;

        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(5, 1fr);
        border: 2px solid #00aa5b85;}
        .box {
          border: 1px solid #00aaaa;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 22px;
          background-color: #d55819
        }
        .one {
          grid-column: 1 / 3;
          grid-row: 1 / 3;
        }
        .three {
          grid-column: 3;
          grid-row: 1;
        }
        .four {
          grid-column: 4;
          grid-row: 1;
        }
        .seven {
          grid-column: 3;
          grid-row: 2;
        }
        .eight {
          grid-column: 4;
          grid-row: 2;
        }
        .nine {
          grid-column: 1;
          grid-row: 3 / 6;
        }
        .ten {
          grid-column: 2;
          grid-row: 3;
        }
        .fourteen {
          grid-column: 2;
          grid-row: 4;
        }
        .eighteen {
          grid-column: 2;
          grid-row: 5;
        }
        .eleven {
          grid-column: 3 / 5;
          grid-row: 3 / 6;
        }
    </style>
  </head>
  <body>
    
    <div class="container">
       <div class="box one">1</div>

       <div class="box three">3</div>
       <div class="box four">4</div>

       <div class="box seven">7</div>
       <div class="box eight">8</div>

       <div class="box nine">9</div>

       <div class="box ten">10</div>
       <div class="box fourteen">14</div>
       <div class="box eighteen">18</div>

       <div class="box eleven">11</div>
    </div>

  </body>
  </html>
